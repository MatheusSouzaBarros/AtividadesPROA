<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula - JavaScript</title>
</head>
<body>
    <h1>Testando calculos com JavaScript</h1>
    <script>
        let num1 = parseFloat(prompt("Entre com Primeiro numero: "))
        let num2 = parseFloat(prompt("Entre com Segundo numero: "))

        document.write("o primeiro numero inserido foi: "+ num1 + "<br>")
        document.write("o segundo numero inserido foi: "+ num2 + "<br>")

        let soma = num1 + num2
        let multip = num1 * num2
        let subt = num1 - num2
        let divi = num1 / num2

        document.write("Resultado: "+ soma + "<br>")
        document.write("Resultado: "+ multip + "<br>")
        document.write("Resultado: "+ subt + "<br>")
        document.write("Resultado: "+ divi)
    </script>
</body>
</html>
