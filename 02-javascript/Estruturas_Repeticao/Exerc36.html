<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 36</title>
</head>
<body>
    <h1>36- Faça um programa que exiba os números de 1 a 10 usando o loop "while".</h1>
    <script>
        let num = 0
        let i = 1

        while (i <= 10) {
            i++
            num = num + 1
            document.write(num + "<br>")
        }
    </script>
</body>
</html>
