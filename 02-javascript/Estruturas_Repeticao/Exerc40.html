<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 40</title>
</head>
<body>
    <h1>40-  Escreva um programa que leia um número inteiro e exiba a tabuada desse número até o décimo valor usando o loop "while".</h1>
    <script>
        let i = 1
        let num = parseInt(prompt("Digite um número inteiro: "))

        while (i <= 10) {
            let resultado = num * i
            document.write(num + " x " + i + " = " + resultado + "<br>")
            i++
        }
    </script>
</body>
</html>
