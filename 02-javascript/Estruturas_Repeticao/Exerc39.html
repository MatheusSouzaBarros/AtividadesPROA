<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 39</title>
</head>
<body>
    <h1>39- Faça um programa que leia 5 números inteiros usando o loop "while" 
        e exiba a média aritmética dos valores lidos.</h1>
    <script>
        let i = 1
        let numero = 0
        let numSoma = 0
        let media = 0

        while (i <= 5) {
            let num = parseInt(prompt("Digite o " + i + "º número:"))
            numSoma = numSoma + num
            i++
        }

        media = numSoma / 5
        document.write("A média aritmética dos valores lidos é: " + media)
    </script>
</body>
</html>
