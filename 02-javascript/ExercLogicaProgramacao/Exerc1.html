<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>
</head>
<body>
    <h1> 1- Faça um programa que solicite dois números inteiros e exiba a soma, 
        subtração, multiplicação e divisão entre eles.</h1>
    <script>
        let num1 = parseFloat(prompt("Digite o primeiro numero: "))
        let num2 = parseFloat(prompt("Digite o segundo numero: "))

        soma = num1 + num2
        sub = num1 - num2
        multi = num1 * num2
        divs = num1 / num2

        document.write("Resultado: "+ soma + "<br/>")
        document.write("Resultado: "+ sub + "<br/>")
        document.write("Resultado: "+ multi + "<br/>")
        document.write("Resultado: "+ divs + "<br/>")
    </script>
</body>
</html>
