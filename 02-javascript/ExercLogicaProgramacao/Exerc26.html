<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 26</title>
</head>
<body>
    <h1>26- Escreva um programa que leia o código de um produto e a quantidade comprada, e exiba o valor total a ser pago. 
        Considere que cada produto tem um preço diferente.</h1>
    <script>
        let codigo = parseInt(prompt("Digite o código do produto: 1, 2 ,3 ou 4"))
        let quantidade = parseInt(prompt("Digite a quantidade comprada:"))

        let preco
        let total

        if (codigo === 1) {
            preco = 10
        } else if (codigo === 2) {
            preco = 15
        } else if (codigo === 3) {
            preco = 20
        } else if (codigo === 4) {
            preco = 25
        } else {
            alert("Código de produto inválido.")
        }

        total = preco * quantidade

        alert("Valor total a pagar: R$ " + total.toFixed(2))
    </script>
</body>
</html>
