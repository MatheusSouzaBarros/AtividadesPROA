<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
</head>
<body>
    <h1>3- Crie um programa que leia a base e a altura de um triângulo e calcule sua área.</h1>
    <script>
        let num1 = parseFloat(prompt("Digite o valor da base do triangulo: "))
        let num2 = parseFloat(prompt("Digite o valor da altura do triangulo: "))

        calc = (num1 * num2) / 2
        calc = calc.toFixed(2)

        document.write("A area do seu triangulo é: "+ calc)
    </script>
</body>
</html>
