<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 13</title>
</head>
<body>
    <h1>13- Faça um programa que leia dois números inteiros e verifique se o primeiro é múltiplo do segundo.</h1>
    <script>
        let num1 = parseInt(prompt("Digite o primeiro número:"))
        let num2 = parseInt(prompt("Digite o segundo número:"))

        if (num2 !== 0) {
            if (num1 % num2 === 0) {
                alert("O primeiro número é múltiplo do segundo.")
            } else {
                alert("O primeiro número não é múltiplo do segundo.")
            }
        } else {
            alert("O segundo número não pode ser zero.")
        }
    </script>
</body>
</html>
