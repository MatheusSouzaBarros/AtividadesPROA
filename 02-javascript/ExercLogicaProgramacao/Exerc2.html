<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>
</head>
<body>
    <script>
        let raio = parseFloat(prompt("Digite o raio do circulo: "))

        calc = 3.14 * (raio * raio)
        calc1 = 3.14 * (raio * 2)
        calc1 = calc1.toFixed(2)

        document.write("O resultado da area: "+ calc + "<br/>")
        document.write("O resultado do perimetro: "+ calc1 + "<br/>")
    </script>
</body>
</html>
