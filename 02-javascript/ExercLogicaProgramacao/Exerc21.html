<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 21</title>
</head>
<body>
    <h1>21- Crie um programa que leia a idade de um grupo de pessoas e exiba quantas são menores de idade e quantas são maiores de idade.</h1>
    <script>
        let menores = 0
        let maiores = 0

        let quantidade = parseInt(prompt("Digite a quantidade de pessoas:"))

        for (let i = 0; i < quantidade; i++) {
            let idade = parseInt(prompt("Digite a idade da pessoa:"));

            if (idade < 18) {
                menores++
            } else {
                maiores++
            }
        }

        document.write("Menores de idade: " + menores + "<br>")
        document.write("Maiores de idade: " + maiores)
    </script>
</body>
</html>
