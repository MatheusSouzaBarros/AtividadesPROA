<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 12</title>
</head>
<body>
    <h1>Crie um programa que leia o peso e a altura de uma pessoa e exiba o seu Índice de Massa Corporal (IMC).</h1>
    <script>
        let peso = parseFloat(prompt("Digite o seu peso: "))
        let altura = parseFloat(prompt("Digite a sua altura: "))
 
        let imc = (peso / (altura * altura))
    
        document.write("O seu IMC é: " + imc.toFixed(2))
    
        if (imc <= 18.5) {
                document.write("<br>" + "Você está abaixo do peso");
            } else if (imc >= 18.6 && imc <= 24.9) {
                document.write("<br>" + "Você está com o peso normal");
            } else if (imc >= 25.0 && imc <= 29.9) {
                document.write("<br>" + "Você está acima do peso");
            } else if (imc >= 30.0 && imc <= 39.9) {
                document.write("<br>" + "Você está com obesidade Grau I");
            } else if (imc >= 40.0) {
                document.write("<br>" + "Você está com obesidade Grau II");
            } else {
                document.write("<br>" + "Não foi possível classificar. Verifique os valores digitados.");
            }
    </script>
</body>
</html>
