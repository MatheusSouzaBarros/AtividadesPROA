<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 29</title>
</head>
<body>
    <h1>Escreva um programa que leia o nome e a nota de um aluno e exiba sua situação na disciplina. 
        Se a nota for maior ou igual a 7, o aluno está aprovado. Caso contrário, está em recuperação.</h1>
    <script>
        let nota = parseFloat(prompt("Digite a nota que voce tirou na materia: "))

        if (nota < 7) {
            document.write("Voce esta de recuperacao de muleque")
        } else {
            document.write("Voce esta aprovado")
        } 
    </script>
</body>
</html>
