<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 30</title>
</head>
<body>
    <h1>30- Crie um programa que leia o número de maçãs compradas e exiba o valor total a ser pago. 
        O preço das maçãs é de R$ 0,50 cada se a quantidade for menor que 12 e R$ 0,40 cada se a quantidade for igual ou maior que 12.</h1>
    <script>
        let macas = parseInt(prompt("Digite quantas maças foram compradas: "))

        if (macas <= 12) {
            conta = macas * 0.50
            document.write("A conta deu: "+ conta.toFixed(2))
        } else {
            conta = macas * 0.40
            document.write("A conta deu o total de: "+ conta.toFixed(2))
        }
    </script>
</body>
</html>
