<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 7</title>
</head>
<body>
    <h1>7- Faça um programa que receba o salário base de um funcionário e calcule o seu salário líquido, 
        considerando que o funcionário recebe 5% de comissão sobre o salário base.</h1>
    <script>
        let salario = parseFloat(prompt("Digite seu salario: "))

        comissao = salario * 0.05
        salarioL = salario + comissao

        document.write("Seu salario é de: "+ salarioL)
    </script>
</body>
</html>
