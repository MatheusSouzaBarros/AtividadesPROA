<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 6</title>
</head>
<body>
    <h1>6- Crie um programa que leia um número inteiro e exiba se ele é par ou ímpar.</h1>
    <script>
        let num = parseInt(prompt("DIgite um numero: "))

        if (num %2 == 0) {
            document.write("Seu numero é par"+ num)
        } else {
            document.write("Seu numero é impar"+ num)
        }
    </script>
</body>
</html>
