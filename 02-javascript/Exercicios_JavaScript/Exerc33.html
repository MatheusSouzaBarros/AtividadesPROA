<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 33</title>
</head>
<body>
    <h1>33- Crie um programa que leia o nome e o turno (M ou V) de um aluno e exiba uma mensagem de saudação de acordo com o turno. 
        Matutino: "Bom dia, aluno", Vespertino: "Boa tarde, aluno".</h1>
    <script>
        let horario = prompt("Digite seu turno (M) ou (V)").toUpperCase()

        switch (horario) {
            case "M":
                document.write("Bom dia, Aluno")
                break;
            case "V":
                document.write("Boa tarde, aluno")
                break;
            default:
                document.write("Turno não encontrado")
        }
    </script>
</body>
</html>
