<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 25</title>
</head>
<body>
    <h1>25- Faça um programa que leia o número de faltas de um aluno em uma disciplina e exiba sua situação. 
        Se o número de faltas for maior que 15, ele é reprovado por falta.</h1>
    <script>
        let faltas = parseInt(prompt("Digite o seu numero de faltas no mes: "))

        if (faltas <= 5) {
            alert("Seu numero de faltas é suave ainda")
        } else if (faltas <= 14) {
            alert("Abre o olho voce esta com risco de ser reprovado")
        } else {
            alert("VOCE ESTA REPROVADO")
        }
    </script>
</body>
</html>
