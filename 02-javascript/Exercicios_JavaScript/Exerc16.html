<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 16</title>
</head>
<body>
    <h1>16- Faça um programa que verifique se um número é positivo, negativo ou zero.</h1>
    <script>
        let num = parseInt(prompt("Digite um número: "));

            if (num > 0) {
                document.write("Seu número é positivo: " + num);
            } else if (num < 0) {
                document.write("Seu número é negativo: " + num);
            } else {
                document.write("Seu número é zero");
            }
    </script>
</body>
</html>
