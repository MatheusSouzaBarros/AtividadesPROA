<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 15</title>
</head>
<body>
    <h1>15- Crie um programa que leia o salário de um funcionário e calcule o novo salário com um aumento de 15%.</h1>
    <script>
        let salario = parseFloat(prompt("Digite o salário do funcionário:"))
        let aumento = salario * 0.15;

        novoSalario = salario + aumento

        document.write("O novo salário com aumento de 15% é: R$ " + novoSalario.toFixed(2))
    </script>
</body>
</html>
